<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nimbus SSO — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0F172A; --ink-soft:#4B5768; --bg:#EEF2F6; --surface:#FFFFFF; --line:#DCE3EA;
    --accent-a:#1FCB8E; --accent-b:#2E7FFF;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; font-family:'Inter',sans-serif; color:var(--ink);
    background:var(--bg); display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    box-shadow:0 12px 32px -8px rgba(15,23,42,.14); padding:36px; max-width:420px; width:100%; text-align:center;
  }
  .avatar{
    width:56px;height:56px;border-radius:50%;margin:0 auto 16px;
    background:linear-gradient(135deg,var(--accent-a),var(--accent-b));
    display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Sora',sans-serif;font-weight:800;font-size:20px;
  }
  h1{font-family:'Sora',sans-serif;font-size:20px;margin:0 0 6px}
  p{color:var(--ink-soft);font-size:14px;margin:0 0 24px}
  button{
    border:none;border-radius:9px;padding:11px 18px;font-family:'Sora',sans-serif;font-weight:700;
    font-size:14px;color:#fff;background:linear-gradient(135deg,var(--accent-a),var(--accent-b));cursor:pointer;
  }
  #loading{color:var(--ink-soft);font-size:14px}
</style>
</head>
<body>
  <div class="card" id="card" style="display:none">
    <div class="avatar" id="avatarInitial">?</div>
    <h1 id="greeting">Halo!</h1>
    <p>Anda berhasil masuk melalui sesi Nimbus SSO.</p>
    <button id="logoutBtn">Keluar</button>
  </div>
  <p id="loading">Memeriksa sesi…</p>

<script>
  (async () => {
    const res = await fetch('/api/me');
    if (!res.ok) {
      window.location.href = '/index.html';
      return;
    }
    const data = await res.json();
    document.getElementById('loading').style.display = 'none';
    document.getElementById('card').style.display = 'block';
    document.getElementById('greeting').textContent = 'Halo, ' + (data.displayName || data.username);
    document.getElementById('avatarInitial').textContent = (data.displayName || data.username)[0].toUpperCase();
  })();

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await fetch('/api/logout', { method: 'POST' });
    window.location.href = '/index.html';
  });
</script>
</body>
</html>
